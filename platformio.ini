; ESP32 CYD 2.8" (ESP32-2432S028) Adaptation
; Commercial use of this code is strictly prohibited.

[platformio]
default_envs = cyd_ili9341

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TJpg_Decoder @ ^1.1.0

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT=1

; Standard CYD 2.8" (Single Micro-USB, ILI9341 driver - ESP32-2432S028R)
[env:cyd_ili9341]
build_flags =
    ${env.build_flags}
    -DILI9341_2_DRIVER=1
    -DCYD_VARIANT_ILI9341=1

; Newer CYD 2.8" V2/V3 (Dual USB: Micro-USB + USB-C, ST7789 driver)
[env:cyd_st7789]
build_flags =
    ${env.build_flags}
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_INVERSION_OFF=1
    -DCYD_VARIANT_ST7789=1
